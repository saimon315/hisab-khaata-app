<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>খরচের হিসাব</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d9488" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --balance-grad-start: #14b8a6;
    --balance-grad-end: #0d9488;
    --balance-shadow: rgba(13, 148, 136, 0.28);
    --income-bg: #dbeafe;
    --income-color: #3b82f6;
    --expense-bg: #fee2e2;
    --expense-color: #ef4444;
    --warn-bg: #fef3c7;
    --warn-color: #d97706;
    --fab-shadow: rgba(13, 148, 136, 0.4);
    --border: #e2e8f0;
    --chip-active-bg: #0f172a;
    --chip-active-color: #fff;
    --overlay: rgba(15, 23, 42, 0.45);
  }
  [data-theme="bw"] {
    --bg: #ffffff;
    --card-bg: #fafafa;
    --card-shadow: 0 0 0 1px #e0e0e0;
    --text-primary: #111111;
    --text-secondary: #555555;
    --text-muted: #9a9a9a;
    --balance-grad-start: #2b2b2b;
    --balance-grad-end: #000000;
    --balance-shadow: rgba(0, 0, 0, 0.25);
    --income-bg: #ececec;
    --income-color: #111111;
    --expense-bg: #ececec;
    --expense-color: #111111;
    --warn-bg: #e5e5e5;
    --warn-color: #111111;
    --fab-shadow: rgba(0, 0, 0, 0.35);
    --border: #d6d6d6;
    --chip-active-bg: #111111;
    --chip-active-color: #ffffff;
    --overlay: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: 'Hind Siliguri', sans-serif;
    color: var(--text-primary);
    transition: background 0.2s ease;
  }
  .app-root {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 18px 100px;
    position: relative;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .app-header h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
  }
  .header-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .balance-card {
    background: linear-gradient(135deg, var(--balance-grad-start) 0%, var(--balance-grad-end) 100%);
    border-radius: 20px;
    padding: 24px 22px;
    color: #ffffff;
    box-shadow: 0 10px 25px var(--balance-shadow);
    margin-bottom: 16px;
  }
  .balance-label { font-size: 14px; opacity: 0.9; margin: 0 0 6px; }
  .balance-value { font-size: 36px; font-weight: 700; margin: 0; letter-spacing: 0.3px; }

  .stat-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 16px;
    box-shadow: var(--card-shadow);
  }
  .stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--text-secondary); font-size: 14px; }
  .stat-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .stat-icon.add { background: var(--income-bg); color: var(--income-color); }
  .stat-icon.spent { background: var(--expense-bg); color: var(--expense-color); }
  .stat-value { font-size: 21px; font-weight: 700; }
  .stat-value.add { color: var(--income-color); }
  .stat-value.spent { color: var(--expense-color); }

  .budget-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 15px 16px;
    box-shadow: var(--card-shadow);
    margin-bottom: 22px;
  }
  .budget-card.over { background: var(--warn-bg); }
  .budget-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .budget-top .lbl { font-size: 13.5px; color: var(--text-secondary); font-weight: 600; }
  .budget-card.over .lbl { color: var(--warn-color); }
  .budget-top .amt { font-size: 13.5px; color: var(--text-muted); }
  .budget-card.over .amt { color: var(--warn-color); }
  .budget-track { background: var(--border); height: 8px; border-radius: 5px; overflow: hidden; }
  .budget-fill { background: var(--balance-grad-end); height: 100%; border-radius: 5px; }
  .budget-card.over .budget-fill { background: var(--warn-color); }
  .budget-warn-text { font-size: 12.5px; color: var(--warn-color); margin: 8px 0 0; }

  .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .section-header h2 { font-size: 19px; font-weight: 700; margin: 0; color: var(--text-primary); }
  .section-header .count { font-size: 14px; color: var(--text-muted); }

  .txn-list { display: flex; flex-direction: column; gap: 10px; }
  .txn-row {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 13px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--card-shadow);
  }
  .txn-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .txn-icon.income { background: var(--income-bg); color: var(--income-color); }
  .txn-icon.expense { background: var(--expense-bg); color: var(--expense-color); }
  .txn-info { flex: 1; min-width: 0; }
  .txn-cat { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn-date { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .txn-amt { font-size: 15.5px; font-weight: 700; flex-shrink: 0; }
  .txn-amt.income { color: var(--income-color); }
  .txn-amt.expense { color: var(--expense-color); }
  .txn-del { background: none; border: none; color: var(--text-muted); font-size: 16px; padding: 0 0 0 2px; cursor: pointer; flex-shrink: 0; opacity: 0.6; }

  .empty-state { text-align: center; padding: 60px 20px 30px; color: var(--text-muted); }
  .empty-state svg { margin-bottom: 14px; opacity: 0.6; }
  .empty-state .main { font-size: 16px; color: var(--text-muted); margin: 0 0 4px; }
  .empty-state .sub { font-size: 13.5px; color: var(--text-muted); opacity: 0.7; margin: 0; }

  .month-section { margin-top: 24px; }
  .month-grid { display: flex; gap: 12px; }
  .month-card { flex: 1; background: var(--card-bg); border-radius: 14px; padding: 13px 14px; box-shadow: var(--card-shadow); }
  .month-card .lbl { font-size: 13px; color: var(--text-muted); margin: 0 0 5px; }
  .month-card .val { font-size: 18px; font-weight: 700; }
  .month-card.income .val { color: var(--income-color); }
  .month-card.expense .val { color: var(--expense-color); }

  .cat-section { margin-top: 24px; }
  .cat-row { margin-bottom: 12px; }
  .cat-label { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; color: var(--text-secondary); }
  .cat-track { background: var(--expense-bg); height: 7px; border-radius: 4px; overflow: hidden; }
  .cat-fill { background: var(--expense-color); height: 100%; border-radius: 4px; }

  .fab {
    position: fixed;
    bottom: 24px; right: 20px;
    max-width: 480px;
    background: linear-gradient(135deg, var(--balance-grad-start) 0%, var(--balance-grad-end) 100%);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 15px 22px;
    font-size: 16px;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 20px var(--fab-shadow);
    cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif;
    z-index: 20;
  }

  .sheet-overlay {
    display: none;
    position: fixed; inset: 0;
    background: var(--overlay);
    z-index: 30;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 26px;
    animation: slideUp 0.22s ease-out;
    max-height: 85vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-title { font-size: 17px; font-weight: 700; margin: 0 0 16px; color: var(--text-primary); }
  .type-toggle { display: flex; gap: 10px; margin-bottom: 14px; }
  .type-btn {
    flex: 1; padding: 11px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--card-bg); font-weight: 600; font-size: 14.5px; cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif; color: var(--text-secondary);
  }
  .type-btn.income.active { background: var(--income-bg); border-color: var(--income-color); color: var(--income-color); }
  .type-btn.expense.active { background: var(--expense-bg); border-color: var(--expense-color); color: var(--expense-color); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 13px; border-radius: 12px; border: 1.5px solid var(--border);
    font-size: 15px; font-family: 'Hind Siliguri', sans-serif; color: var(--text-primary);
    background: var(--card-bg);
  }
  .field input:focus { outline: none; border-color: var(--balance-grad-end); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 7px 13px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card-bg); font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-color); border-color: var(--chip-active-bg); }
  .sheet-buttons { display: flex; gap: 10px; }
  .btn-primary { flex: 1; background: var(--balance-grad-end); color: #fff; border: none; padding: 13px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Hind Siliguri', sans-serif; }
  .btn-cancel { background: var(--bg); border: none; padding: 13px 18px; border-radius: 14px; color: var(--text-secondary); cursor: pointer; font-family: 'Hind Siliguri', sans-serif; font-weight: 600; }

  .theme-option {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 12px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    margin-bottom: 10px;
    cursor: pointer;
  }
  .theme-option.selected { border-color: var(--balance-grad-end); background: color-mix(in srgb, var(--balance-grad-end) 8%, var(--card-bg)); }
  .theme-swatch { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; }
  .theme-swatch.teal { background: linear-gradient(135deg, #14b8a6, #0d9488); }
  .theme-swatch.bw { background: linear-gradient(135deg, #2b2b2b, #000000); }
  .theme-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .theme-check { margin-left: auto; color: var(--balance-grad-end); font-size: 18px; visibility: hidden; }
  .theme-option.selected .theme-check { visibility: visible; }

  .settings-label { font-size: 13px; color: var(--text-secondary); margin: 22px 0 10px; }
  .settings-label:first-of-type { margin-top: 0; }

  .backup-row { display: flex; gap: 10px; }
  .backup-btn {
    flex: 1;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    color: var(--text-primary);
    padding: 12px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif;
    text-align: center;
  }

  .danger-btn {
    width: 100%;
    background: var(--card-bg);
    border: 1.5px solid var(--expense-color);
    color: var(--expense-color);
    padding: 13px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif;
    margin-top: 8px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: var(--bg);
    padding: 11px 20px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-root">
  <div class="app-header">
    <h1>খরচের হিসাব</h1>
    <button class="header-btn" onclick="openSettings()" aria-label="সেটিংস">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </div>

  <div class="balance-card">
    <p class="balance-label">অবশিষ্ট ব্যালেন্স</p>
    <p class="balance-value" id="balanceText">৳ ০</p>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-top">
        <span class="stat-icon add">+</span>
        <span>মোট জমা</span>
      </div>
      <div class="stat-value add" id="totalIncomeText">৳ ০</div>
    </div>
    <div class="stat-card">
      <div class="stat-top">
        <span class="stat-icon spent">−</span>
        <span>মোট খরচ</span>
      </div>
      <div class="stat-value spent" id="totalExpenseText">৳ ০</div>
    </div>
  </div>

  <div id="budgetSection"></div>

  <div class="section-header">
    <h2>লেনদেন</h2>
    <span class="count" id="txnCount">০ টি</span>
  </div>

  <div id="ledgerList"></div>

  <div id="summarySections"></div>
</div>

<button class="fab" onclick="openSheet()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  যোগ করুন
</button>

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="sheetOverlay" onclick="handleOverlayClick(event, 'sheetOverlay', closeSheet)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">নতুন লেনদেন যোগ করুন</p>
    <div class="type-toggle">
      <button type="button" class="type-btn income" id="incomeBtn" onclick="setType('income')">জমা</button>
      <button type="button" class="type-btn expense" id="expenseBtn" onclick="setType('expense')">খরচ</button>
    </div>
    <form onsubmit="submitEntry(event)">
      <div class="field">
        <label>টাকার পরিমাণ</label>
        <input type="number" inputmode="decimal" min="0" step="0.01" id="amountInput" required />
      </div>
      <div class="field">
        <label id="categoryLabel">বিবরণ</label>
        <input type="text" id="categoryInput" required />
      </div>
      <div class="chip-row" id="chipsRow"></div>
      <div class="field">
        <label>তারিখ</label>
        <input type="date" id="dateInput" required />
      </div>
      <div class="sheet-buttons">
        <button type="submit" class="btn-primary">যোগ করুন</button>
        <button type="button" class="btn-cancel" onclick="closeSheet()">বাতিল</button>
      </div>
    </form>
  </div>
</div>

<div class="sheet-overlay" id="settingsOverlay" onclick="handleOverlayClick(event, 'settingsOverlay', closeSettings)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">সেটিংস</p>

    <p class="settings-label">থিম বেছে নাও</p>
    <div class="theme-option" id="themeTealOption" onclick="setTheme('default')">
      <div class="theme-swatch teal"></div>
      <span class="theme-name">টিল (ডিফল্ট)</span>
      <span class="theme-check">✓</span>
    </div>
    <div class="theme-option" id="themeBwOption" onclick="setTheme('bw')">
      <div class="theme-swatch bw"></div>
      <span class="theme-name">ব্ল্যাক অ্যান্ড হোয়াইট</span>
      <span class="theme-check">✓</span>
    </div>

    <p class="settings-label">মাসিক বাজেট লিমিট</p>
    <div class="field" style="margin-bottom:8px;">
      <input type="number" inputmode="decimal" min="0" step="1" id="budgetInput" placeholder="যেমন: ৩০০০ (ফাঁকা রাখলে বাজেট বন্ধ থাকবে)" />
    </div>
    <button type="button" class="backup-btn" style="width:100%; margin-bottom:4px;" onclick="saveBudgetSetting()">বাজেট সেভ করো</button>

    <p class="settings-label">ডেটা ব্যাকআপ</p>
    <div class="backup-row">
      <button type="button" class="backup-btn" onclick="exportData()">এক্সপোর্ট করো</button>
      <button type="button" class="backup-btn" onclick="document.getElementById('importFile').click()">ইমপোর্ট করো</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />

    <p class="settings-label">বিপজ্জনক এলাকা</p>
    <button class="danger-btn" onclick="clearAllData()">সব হিসাব মুছে ফেলুন</button>

    <div class="sheet-buttons" style="margin-top:18px;">
      <button type="button" class="btn-cancel" style="flex:1; text-align:center;" onclick="closeSettings()">বন্ধ করুন</button>
    </div>
  </div>
</div>

<script>
  const CATEGORY_PRESETS = {
    income: ["বাবা", "মা", "টিউশনি", "অন্যান্য"],
    expense: ["খাবার", "যাতায়াত", "বই/পড়াশোনা", "মোবাইল/নেট", "বিনোদন", "অন্যান্য"]
  };

  let entries = [];
  let formType = "expense";
  let budget = null;

  function loadEntries() {
    try {
      const raw = localStorage.getItem("khata-entries");
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) { entries = []; }
  }
  function saveEntries() { localStorage.setItem("khata-entries", JSON.stringify(entries)); }

  function loadBudget() {
    const raw = localStorage.getItem("khata-budget");
    budget = raw ? parseFloat(raw) : null;
    document.getElementById("budgetInput").value = budget || "";
  }
  function saveBudgetSetting() {
    const val = parseFloat(document.getElementById("budgetInput").value);
    if (!val || val <= 0) {
      budget = null;
      localStorage.removeItem("khata-budget");
      showToast("বাজেট বন্ধ করা হয়েছে");
    } else {
      budget = val;
      localStorage.setItem("khata-budget", String(val));
      showToast("বাজেট সেভ হয়েছে");
    }
    renderAll();
  }

  function bn(n) { return new Intl.NumberFormat("bn-BD").format(Math.round(n)); }
  function bnDate(iso) {
    try {
      const d = new Date(iso + "T00:00:00");
      return new Intl.DateTimeFormat("bn-BD", { day: "numeric", month: "short" }).format(d);
    } catch (e) { return iso; }
  }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
